<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaserLayer Pro v3</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        .container { max-width: 500px; margin: 0 auto; }
        h1 { color: #00adb5; font-size: 26px; margin-bottom: 5px; font-weight: 800; }
        p { color: #aaaaaa; font-size: 13px; margin-top: 0; margin-bottom: 20px; }
        .box {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            margin-bottom: 15px;
            border: 1px solid #2d2d2d;
            text-align: left;
        }
        .btn-blue {
            background-color: #00adb5;
            color: white;
            padding: 14px 20px;
            border-radius: 10px;
            cursor: pointer;
            display: inline-block;
            font-weight: bold;
            border: none;
            width: 100%;
            box-sizing: border-box;
            font-size: 15px;
            text-align: center;
        }
        .btn-blue:hover { background-color: #008c95; }
        .btn-secondary { background-color: #222831; border: 1px solid #393e46; margin-top: 15px; width: 100%; padding: 14px; border-radius: 10px; color: white; font-weight: bold; font-size: 15px; cursor: pointer; }
        .btn-danger { background-color: #cf6679; color: #121212; margin-top: 10px; width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .control-group { margin: 18px 0; }
        label { display: block; font-size: 14px; color: #00adb5; margin-bottom: 8px; font-weight: 600; }
        select {
            width: 100%;
            background-color: #252525;
            color: white;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #393e46;
            font-size: 14px;
            outline: none;
        }
        input[type="range"] { width: 100%; accent-color: #00adb5; background: #333; height: 6px; border-radius: 3px; }
        .toggle-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #252525;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .toggle-group span { font-size: 14px; color: #eee; }
        .layer-card {
            background: #1e1e1e;
            border: 1px solid #00adb5;
            border-radius: 14px;
            padding: 15px;
            margin-top: 20px;
            text-align: center;
        }
        .layer-card canvas {
            max-width: 100%;
            height: auto;
            background: #2d2d2d;
            border-radius: 8px;
            margin: 10px 0;
            border: 1px dashed #444;
        }
        #original-preview-canvas { max-width: 100%; height: auto; border-radius: 8px; margin-top: 15px; background: #2d2d2d; display: block; width: 100%; }
        .checkbox-switch { WebkitAppearance: none; width: 40px; height: 20px; background: #555; border-radius: 20px; position: relative; cursor: pointer; outline: none; }
        .checkbox-switch:checked { background: #00adb5; }
        .checkbox-switch:before { content: ''; position: absolute; width: 16px; height: 16px; border-radius: 50%; top: 2px; left: 2px; background: #fff; }
        .checkbox-switch:checked:before { left: 22px; }
    </style>
</head>
<body>

<div class="container">
    <h1>LaserLayer Pro</h1>
    <p>Preparación avanzada de imágenes para corte y grabado láser</p>

    <div class="box">
        <label class="btn-blue">
            📁 1. Cargar Imagen (PNG / JPG)
            <input type="file" id="image-input" accept="image/*" style="display: none;">
        </label>
        <canvas id="original-preview-canvas"></canvas>
    </div>

    <div class="box" id="controls">
        <div class="control-group">
            <label for="processing-mode">Modo de Procesamiento:</label>
            <select id="processing-mode">
                <option value="automatic">Capas Automáticas por Tonos</option>
                <option value="manual">Ajuste Manual de Umbral (Silueta Única)</option>
            </select>
        </div>

        <div class="control-group" id="auto-controls">
            <label for="layers-count">Número de capas automáticas: <span id="layers-val">3</span></label>
            <input type="range" id="layers-count" min="2" max="6" value="3">
        </div>

        <div class="control-group" id="manual-controls" style="display: none;">
            <label for="threshold-slider">Punto de corte blanco/negro: <span id="threshold-val">128</span></label>
            <input type="range" id="threshold-slider" min="0" max="255" value="128">
        </div>

        <div class="control-group">
            <label for="format-select">Formato de guardado final:</label>
            <select id="format-select">
                <option value="image/png">PNG (Fondo Transparente)</option>
                <option value="image/jpeg">JPG (Fondo Blanco Plano)</option>
            </select>
        </div>

        <div class="toggle-group">
            <span>Invertir Colores (Modo Negativo)</span>
            <input type="checkbox" id="invert-toggle" class="checkbox-switch">
        </div>

        <div class="toggle-group">
            <span>Extraer solo Contornos (Línea de Corte)</span>
            <input type="checkbox" id="contour-toggle" class="checkbox-switch">
        </div>

        <button class="btn-secondary" id="process-btn">⚙️ 2. Procesar y Separar</button>
        <button class="btn-danger" id="reset-btn">🗑️ Limpiar Todo</button>
    </div>

    <div id="layers-container"></div>
</div>

<script>
    const imageInput = document.getElementById('image-input');
    const originalCanvas = document.getElementById('original-preview-canvas');
    const originalCtx = originalCanvas.getContext('2d');
    const processingMode = document.getElementById('processing-mode');
    const autoControls = document.getElementById('auto-controls');
    const manualControls = document.getElementById('manual-controls');
    const layersCount = document.getElementById('layers-count');
    const layersVal = document.getElementById('layers-val');
    const thresholdSlider = document.getElementById('threshold-slider');
    const thresholdVal = document.getElementById('threshold-val');
    const processBtn = document.getElementById('process-btn');
    const resetBtn = document.getElementById('reset-btn');
    const layersContainer = document.getElementById('layers-container');
    const invertToggle = document.getElementById('invert-toggle');
    const contourToggle = document.getElementById('contour-toggle');
    const formatSelect = document.getElementById('format-select');

    let imageLoaded = false;
    let backupImg = new Image();

    function initCanvas() {
        originalCanvas.width = 400;
        originalCanvas.height = 120;
        originalCtx.fillStyle = "#2d2d2d";
        originalCtx.fillRect(0, 0, 400, 120);
        originalCtx.fillStyle = "#888888";
        originalCtx.font = "14px Arial";
        originalCtx.textAlign = "center";
        originalCtx.fillText("Ninguna imagen cargada aún", 200, 65);
    }
    initCanvas();

    processingMode.addEventListener('change', () => {
        if (processingMode.value === 'automatic') {
            autoControls.style.display = 'block';
            manualControls.style.display = 'none';
        } else {
            autoControls.style.display = 'none';
            manualControls.style.display = 'block';
        }
    });

    layersCount.addEventListener('input', () => { layersVal.textContent = layersCount.value; });
    thresholdSlider.addEventListener('input', () => { thresholdVal.textContent = thresholdSlider.value; });

    // LECTOR NATIVO SÍNCRONO REVISADO (Soluciona el bloqueo de carga de píxeles)
    imageInput.addEventListener('change', function() {
        if (this.files && this.files[0]) {
            const reader = new FileReader();
            reader.onload = function(event) {
                backupImg = new Image();
                backupImg.onload = function() {
                    const MAX_W = 600;
                    let w = backupImg.width;
                    let h = backupImg.height;
                    if (w > MAX_W) {
                        h = Math.round((h * MAX_W) / w);
                        w = MAX_W;
                    }
                    originalCanvas.width = w;
                    originalCanvas.height = h;
                    
                    originalCtx.fillStyle = "#ffffff";
                    originalCtx.fillRect(0, 0, w, h);
                    originalCtx.drawImage(backupImg, 0, 0, w, h);
                    imageLoaded = true;
                };
                backupImg.src = event.target.result;
            };
            reader.readAsDataURL(this.files[0]);
        }
    });

    resetBtn.addEventListener('click', () => {
        imageInput.value = '';
        initCanvas();
        layersContainer.innerHTML = '';
        invertToggle.checked = false;
        contourToggle.checked = false;
        layersCount.value = 3;
        layersVal.textContent = "3";
        thresholdSlider.value = 128;
        thresholdVal.textContent = "128";
        processingMode.value = 'automatic';
        autoControls.style.display = 'block';
        manualControls.style.display = 'none';
        imageLoaded = false;
    });

    processBtn.addEventListener('click', () => {
        if (!imageLoaded) {
            alert("Por favor, selecciona primero una imagen haciendo clic en el botón azul.");
