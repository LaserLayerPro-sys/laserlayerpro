<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaserLayer Pro v6 - Generador Avanzado</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
            color: #ffffff;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { 
            color: #00d4ff; 
            font-size: 32px; 
            margin-bottom: 8px; 
            font-weight: 800;
            text-align: center;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .box {
            background: rgba(30, 30, 46, 0.8);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }
        .btn-primary {
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            cursor: pointer;
            display: inline-block;
            font-weight: bold;
            border: none;
            width: 100%;
            font-size: 16px;
            text-align: center;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.5);
        }
        .btn-secondary { 
            background: rgba(34, 40, 49, 0.8); 
            border: 1px solid #393e46; 
            margin-top: 15px; 
            width: 100%; 
            padding: 16px; 
            border-radius: 12px; 
            color: white; 
            font-weight: bold; 
            font-size: 16px; 
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-secondary:hover {
            background: rgba(50, 60, 70, 0.8);
            border-color: #00d4ff;
        }
        .btn-danger { 
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: white;
            margin-top: 10px; 
            width: 100%; 
            padding: 14px; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }
        .control-group { margin: 20px 0; }
        label { 
            display: block; 
            font-size: 14px; 
            color: #00d4ff; 
            margin-bottom: 10px; 
            font-weight: 600;
        }
        select, input[type="number"], input[type="text"] {
            width: 100%;
            background: rgba(37, 37, 37, 0.8);
            color: white;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #393e46;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }
        select:focus, input:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }
        input[type="range"] { 
            width: 100%; 
            accent-color: #00d4ff; 
            background: #333; 
            height: 6px; 
            border-radius: 3px;
            margin-top: 8px;
        }
        .toggle-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(37, 37, 37, 0.6);
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .toggle-group span { font-size: 14px; color: #eee; }
        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        .view-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .view-tab {
            flex: 1;
            padding: 12px;
            background: rgba(37, 37, 37, 0.6);
            border: 1px solid #393e46;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            transition: all 0.3s;
        }
        .view-tab.active {
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            border-color: #00d4ff;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
        }
        .layer-card {
            background: rgba(30, 30, 46, 0.9);
            border: 2px solid #00d4ff;
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 8px 32px rgba(0, 212, 255, 0.2);
        }
        .layer-card h3 {
            margin: 0 0 15px 0;
            color: #00d4ff;
            font-size: 18px;
        }
        .layer-preview {
            background: #2d2d2d;
            border-radius: 12px;
            padding: 15px;
            margin: 15px 0;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed #444;
        }
        .layer-preview canvas, .layer-preview svg {
            max-width: 100%;
            max-height: 400px;
            background: white;
            border-radius: 8px;
        }
        .download-btn {
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            display: block;
            text-decoration: none;
            font-size: 15px;
            margin-top: 15px;
            text-align: center;
            transition: all 0.3s;
        }
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.4);
        }
        #preview-wrapper {
            background: rgba(45, 45, 45, 0.5);
            border-radius: 12px;
            margin-top: 15px;
            padding: 15px;
            text-align: center;
            min-height: 100px;
        }
        #original-html-img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            display: none;
        }
        #preview-status { color: #888; font-size: 14px; }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        @media (max-width: 768px) {
            .grid-2, .input-row { grid-template-columns: 1fr; }
        }
        .export-all-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            border: none;
            width: 100%;
            font-size: 16px;
            margin-top: 20px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }
        .export-all-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
        }
        .assembly-preview {
            background: rgba(30, 30, 46, 0.9);
            border: 2px solid #10b981;
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            text-align: center;
        }
        .assembly-preview h3 {
            color: #10b981;
            margin-top: 0;
        }
        .assembly-canvas {
            background: #1a1a2e;
            border-radius: 12px;
            margin: 15px auto;
            max-width: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎨 LaserLayer Pro v6</h1>
    <p class="subtitle">Generador Avanzado de Capas para Corte Láser - Exportación SVG</p>

    <div class="box">
        <label class="btn-primary">
            📁 1. Cargar Imagen (PNG / JPG)
            <input type="file" id="image-input" accept="image/*" style="display: none;">
        </label>
        <div id="preview-wrapper">
            <div id="preview-status">Ninguna imagen cargada aún</div>
            <img id="original-html-img" alt="Vista previa">
        </div>
    </div>

    <div class="box" id="controls" style="display: none;">
        <h2 style="color: #00d4ff; margin-top: 0;">⚙️ Configuración</h2>
        
        <div class="grid-2">
            <div class="control-group">
                <label for="processing-mode">Modo de Procesamiento:</label>
                <select id="processing-mode">
                    <option value="automatic">Capas Automáticas por Profundidad</option>
                    <option value="manual">Ajuste Manual de Umbral</option>
                </select>
            </div>

            <div class="control-group">
                <label for="format-select">Formato de Exportación:</label>
                <select id="format-select">
                    <option value="svg">SVG (Vectorial - Recomendado)</option>
                    <option value="png">PNG (Fondo Transparente)</option>
                </select>
            </div>
        </div>

        <div class="control-group" id="auto-controls">
            <label for="layers-count">Número de capas: <span id="layers-val">5</span></label>
            <input type="range" id="layers-count" min="2" max="7" value="5">
        </div>

        <div class="control-group" id="manual-controls" style="display: none;">
            <label for="threshold-slider">Punto de corte: <span id="threshold-val">128</span></label>
            <input type="range" id="threshold-slider" min="0" max="255" value="128">
        </div>

        <div class="input-row">
            <div class="control-group">
                <label for="physical-width">Ancho Físico:</label>
                <input type="number" id="physical-width" value="200" min="10" max="2000">
            </div>
            <div class="control-group">
                <label for="unit-select">Unidad:</label>
                <select id="unit-select">
                    <option value="mm">Milímetros (mm)</option>
                    <option value="in">Pulgadas (in)</option>
                </select>
            </div>
        </div>

        <div class="control-group">
            <label for="material-thickness">Grosor del Material:</label>
            <input type="number" id="material-thickness" value="3" min="0.5" max="20" step="0.5">
            <small style="color: #888; display: block; margin-top: 5px;">Espesor en mm (afecta la separación entre capas)</small>
        </div>

        <div class="toggle-group">
            <span>🔄 Invertir Colores (Modo Negativo)</span>
            <input type="checkbox" id="invert-toggle">
        </div>

        <div class="toggle-group">
            <span>✂️ Extraer solo Contornos</span>
            <input type="checkbox" id="contour-toggle">
        </div>

        <button class="btn-secondary" id="process-btn">⚙️ 2. Procesar y Generar Capas</button>
        <button class="btn-danger" id="reset-btn">🗑️ Limpiar Todo</button>
    </div>

    <div id="layers-container"></div>
</div>

<script>
    const imageInput = document.getElementById('image-input');
    const htmlImg = document.getElementById('original-html-img');
    const previewStatus = document.getElementById('preview-status');
    const processingMode = document.getElementById('processing-mode');
    const autoControls = document.getElementById('auto-controls');
    const manualControls = document.getElementById('manual-controls');
    const layersCount = document.getElementById('layers-count');
    const layersVal = document.getElementById('layers-val');
    const thresholdSlider = document.getElementById('threshold-slider');
    const thresholdVal = document.getElementById('threshold-val');
    const processBtn = document.getElementById('process-btn');
    const resetBtn = document.getElementById('reset-btn');
    const layersContainer = document.getElementById('layers-container');
    const invertToggle = document.getElementById('invert-toggle');
    const contourToggle = document.getElementById('contour-toggle');
    const formatSelect = document.getElementById('format-select');
    const controls = document.getElementById('controls');
    const physicalWidth = document.getElementById('physical-width');
    const unitSelect = document.getElementById('unit-select');
    const materialThickness = document.getElementById('material-thickness');

    let imageLoaded = false;
    let processedLayers = [];

    processingMode.addEventListener('change', () => {
        if (processingMode.value === 'automatic') {
            autoControls.style.display = 'block';
            manualControls.style.display = 'none';
        } else {
            autoControls.style.display = 'none';
            manualControls.style.display = 'block';
        }
    });

    layersCount.addEventListener('input', () => { layersVal.textContent = layersCount.value; });
    thresholdSlider.addEventListener('input', () => { thresholdVal.textContent = thresholdSlider.value; });

    imageInput.addEventListener('change', function() {
        if (this.files && this.files[0]) {
            const file = this.files[0];
            
            if (!file.type.startsWith('image/')) {
                alert('Por favor selecciona un archivo de imagen válido.');
                return;
            }
            
            const reader = new FileReader();
            
            reader.onload = function(event) {
                htmlImg.src = event.target.result;
                
                htmlImg.onload = function() {
                    htmlImg.style.display = 'inline-block';
                    previewStatus.style.display = 'none';
                    controls.style.display = 'block';
                    imageLoaded = true;
                    console.log('✅ Imagen cargada:', htmlImg.naturalWidth, 'x', htmlImg.naturalHeight);
                };
                
                htmlImg.onerror = function() {
                    alert('Error al cargar la imagen.');
                    previewStatus.textContent = 'Error al cargar imagen';
                    previewStatus.style.display = 'block';
                };
            };
            
            reader.onerror = function() {
                alert('Error al leer el archivo.');
            };
            
            reader.readAsDataURL(file);
        }
    });

    resetBtn.addEventListener('click', () => {
        imageInput.value = '';
        htmlImg.src = '';
        htmlImg.style.display = 'none';
        previewStatus.textContent = 'Ninguna imagen cargada aún';
        previewStatus.style.display = 'block';
        controls.style.display = 'none';
        layersContainer.innerHTML = '';
        invertToggle.checked = false;
        contourToggle.checked = false;
        imageLoaded = false;
        processedLayers = [];
    });

    processBtn.addEventListener('click', () => {
        if (!imageLoaded) {
            alert("Por favor, selecciona primero una imagen.");
            return;
        }
        
        layersContainer.innerHTML = '';
        processedLayers = [];
        
        const mode = processingMode.value;
        const invert = invertToggle.checked;
        const extractContours = contourToggle.checked;
        const chosenFormat = formatSelect.value;
        const width = parseFloat(physicalWidth.value);
        const unit = unitSelect.value;
        const thickness = parseFloat(materialThickness.value);
        
        const calcCanvas = document.createElement('canvas');
        const calcCtx = calcCanvas.getContext('2d');
        
        const MAX_W = 800;
        let w = htmlImg.naturalWidth;
        let h = htmlImg.naturalHeight;
        if (w > MAX_W) {
            h = Math.round((h * MAX_W) / w);
            w = MAX_W;
        }
        
        calcCanvas.width = w;
        calcCanvas.height = h;
        calcCtx.fillStyle = "#ffffff";
        calcCtx.fillRect(0, 0, w, h);
        calcCtx.drawImage(htmlImg, 0, 0, w, h);
        
        const imgData = calcCtx.getImageData(0, 0, w, h);
        const data = imgData.data;

        if (mode === 'automatic') {
            const numLayers = parseInt(layersCount.value);
            const step = 255 / numLayers;

            for (let l = 0; l < numLayers; l++) {
                const minGray = l * step;
                const maxGray = (l + 1) * step;
                
                const layerCanvas = document.createElement('canvas');
                layerCanvas.width = w;
                layerCanvas.height = h;
                const layerCtx = layerCanvas.getContext('2d');
                const layerImgData = layerCtx.createImageData(w, h);
                const layerData = layerImgData.data;

                const mask = new Uint8Array(w * h);
                
                for (let i = 0; i < data.length; i += 4) {
                    const idx = i / 4;
                    let gray = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
                    
                    if (invert) gray = 255 - gray;
                    
                    if (gray >= minGray && gray < maxGray) {
                        mask[idx] = 1;
                    }
                }

                for (let y = 0; y < h; y++) {
                    for (let x = 0; x < w; x++) {
                        const idx = y * w + x;
                        const i = idx * 4;
                        
                        let isTarget = false;
                        
                        if (extractContours) {
                            if (mask[idx] === 1) {
                                const left = x > 0 ? mask[idx - 1] : 0;
                                const right = x < w - 1 ? mask[idx + 1] : 0;
                                const up = y > 0 ? mask[idx - w] : 0;
                                const down = y < h - 1 ? mask[idx + w] : 0;
                                
                                if (left === 0 || right === 0 || up === 0 || down === 0) {
                                    isTarget = true;
                                }
                            }
                        } else {
                            isTarget = mask[idx] === 1;
                        }
                        
                        if (isTarget) {
                            layerData[i] = 0;
                            layerData[i+1] = 0;
                            layerData[i+2] = 0;
                            layerData[i+3] = 255;
                        }
                    }
                }
                
                layerCtx.putImageData(layerImgData, 0, 0);
                
                const layerName = `Capa ${l + 1} (${Math.round(minGray)}-${Math.round(maxGray)})`;
                processedLayers.push({
                    canvas: layerCanvas,
                    name: layerName,
                    depth: l * thickness
                });
                
                createLayerCard(layerCanvas, layerName, chosenFormat, w, h, width, unit, l * thickness);
            }
        } else {
            const threshold = parseInt(thresholdSlider.value);
            
            const layerCanvas = document.createElement('canvas');
            layerCanvas.width = w;
            layerCanvas.height = h;
            const layerCtx = layerCanvas.getContext('2d');
            const layerImgData = layerCtx.createImageData(w, h);
            const layerData = layerImgData.data;

            const mask = new Uint8Array(w * h);
            
            for (let i = 0; i < data.length; i += 4) {
                const idx = i / 4;
                let gray = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
                
                if (invert) gray = 255 - gray;
                
                if (gray < threshold) {
                    mask[idx] = 1;
                }
            }

            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const idx = y * w + x;
                    const i = idx * 4;
                    
                    let isTarget = false;
                    
                    if (extractContours) {
                        if (mask[idx] === 1) {
                            const left = x > 0 ? mask[idx - 1] : 0;
                            const right = x < w - 1 ? mask[idx + 1] : 0;
                            const up = y > 0 ? mask[idx - w] : 0;
                            const down = y < h - 1 ? mask[idx + w] : 0;
                            
                            if (left === 0 || right === 0 || up === 0 || down === 0) {
                                isTarget = true;
                            }
                        }
                    } else {
                        isTarget = mask[idx] === 1;
                    }
                    
                    if (isTarget) {
                        layerData[i] = 0;
                        layerData[i+1] = 0;
                        layerData[i+2] = 0;
                        layerData[i+3] = 255;
                    }
                }
            }
            
            layerCtx.putImageData(layerImgData, 0, 0);
            
            const layerName = `Umbral ${threshold}`;
            processedLayers.push({
                canvas: layerCanvas,
                name: layerName,
                depth: 0
            });
            
            createLayerCard(layerCanvas, layerName, chosenFormat, w, h, width, unit, 0);
        }

        // Vista previa de ensamblaje 3D
        createAssemblyPreview(width, unit, thickness);

        // Botón para exportar todas las capas
        if (processedLayers.length > 1) {
            const exportAllBtn = document.createElement('button');
            exportAllBtn.className = 'export-all-btn';
            exportAllBtn.textContent = `📦 Exportar Todas las Capas (${processedLayers.length})`;
            exportAllBtn.onclick = () => exportAllLayers(chosenFormat, width, unit);
            layersContainer.appendChild(exportAllBtn);
        }
    });

    function canvasToSVG(canvas, width, unit) {
        const ctx = canvas.getContext('2d');
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;
        
        const scaleX = width / canvas.width;
        const scaleY = (canvas.height / canvas.width) * width;
        
        let svgPaths = [];
        let pathCount = 0;
        const MAX_ELEMENTS = 15000;
        
        // Agrupar píxeles adyacentes en rectángulos más grandes para optimizar
        const visited = new Uint8Array(canvas.width * canvas.height);
        const blockSize = 3; // Tamaño del bloque para agrupar
        
        for (let y = 0; y < canvas.height; y += blockSize) {
            for (let x = 0; x < canvas.width; x += blockSize) {
                if (pathCount >= MAX_ELEMENTS) break;
                
                // Verificar si el bloque tiene píxeles negros
                let hasBlack = false;
                for (let by = 0; by < blockSize && y + by < canvas.height; by++) {
                    for (let bx = 0; bx < blockSize && x + bx < canvas.width; bx++) {
                        const idx = ((y + by) * canvas.width + (x + bx)) * 4;
                        if (data[idx + 3] > 0) {
                            hasBlack = true;
                            break;
                        }
                    }
                    if (hasBlack) break;
                }
                
                if (hasBlack) {
                    const px = x * scaleX;
                    const py = y * scaleY;
                    const pw = blockSize * scaleX;
                    const ph = blockSize * scaleY;
                    
                    svgPaths.push(`<rect x="${px.toFixed(2)}" y="${py.toFixed(2)}" width="${pw.toFixed(2)}" height="${ph.toFixed(2)}" fill="black"/>`);
                    pathCount++;
                }
            }
            if (pathCount >= MAX_ELEMENTS) break;
        }
        
        const svgContent = `<?xml version="1.0" encoding="UTF-8"?>
<svg width="${width}${unit}" height="${scaleY.toFixed(2)}${unit}" viewBox="0 0 ${width} ${scaleY.toFixed(2)}" xmlns="http://www.w3.org/2000/svg">
  <desc>Generado por LaserLayer Pro v6</desc>
${svgPaths.join('\n')}
</svg>`;
        
        return svgContent;
    }

    function createLayerCard(canvas, title, format, w, h, width, unit, depth) {
        const card = document.createElement('div');
        card.className = 'layer-card';
        
        const h3 = document.createElement('h3');
        h3.textContent = `${title} - Profundidad: ${depth.toFixed(1)}mm`;
        card.appendChild(h3);
        
        const preview = document.createElement('div');
        preview.className = 'layer-preview';
        
        if (format === 'svg') {
            const svgContent = canvasToSVG(canvas, width, unit);
            const svgBlob = new Blob([svgContent], { type: 'image/svg+xml' });
            const svgUrl = URL.createObjectURL(svgBlob);
            const img = document.createElement('img');
            img.src = svgUrl;
            img.style.maxWidth = '100%';
            img.style.maxHeight = '400px';
            preview.appendChild(img);
        } else {
            preview.appendChild(canvas);
        }
        
        card.appendChild(preview);
        
        const downloadLink = document.createElement('a');
        downloadLink.className = 'download-btn';
        downloadLink.textContent = '⬇️ Descargar Capa';
        
        if (format === 'svg') {
            const svgContent = canvasToSVG(canvas, width, unit);
            const blob = new Blob([svgContent], { type: 'image/svg+xml' });
            downloadLink.href = URL.createObjectURL(blob);
            downloadLink.download = `${title.replace(/\s+/g, '_')}.svg`;
        } else {
            downloadLink.href = canvas.toDataURL('image/png');
            downloadLink.download = `${title.replace(/\s+/g, '_')}.png`;
        }
        
        card.appendChild(downloadLink);
        layersContainer.appendChild(card);
    }

    function createAssemblyPreview(width, unit, thickness) {
        if (processedLayers.length === 0) return;
        
        const assemblyDiv = document.createElement('div');
        assemblyDiv.className = 'assembly-preview';
        
        const h3 = document.createElement('h3');
        h3.textContent = '🏗️ Vista Previa de Ensamblaje 3D';
        assemblyDiv.appendChild(h3);
        
        const info = document.createElement('p');
        info.style.color = '#888';
        info.style.fontSize = '14px';
        info.textContent = `Profundidad total: ${(processedLayers.length * thickness).toFixed(1)}mm | ${processedLayers.length} capas × ${thickness}mm`;
        assemblyDiv.appendChild(info);
        
        const canvas = document.createElement('canvas');
        canvas.className = 'assembly-canvas';
        canvas.width = 600;
        canvas.height = 400;
        const ctx = canvas.getContext('2d');
        
        // Dibujar vista isométrica de las capas apiladas
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        const layerSpacing = 20;
        const offsetX = 100;
        const offsetY = 50;
        
        processedLayers.forEach((layer, index) => {
            const y = offsetY + index * layerSpacing;
            const scale = 0.5;
            const lw = layer.canvas.width * scale;
            const lh = layer.canvas.height * scale;
            
            // Sombra
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(offsetX + 5, y + 5, lw, lh);
            
            // Capa
            ctx.fillStyle = `hsl(${180 + index * 30}, 70%, 50%)`;
            ctx.fillRect(offsetX, y, lw, lh);
            ctx.strokeStyle = '#00d4ff';
            ctx.lineWidth = 2;
            ctx.strokeRect(offsetX, y, lw, lh);
            
            // Etiqueta
            ctx.fillStyle = 'white';
            ctx.font = '12px Arial';
            ctx.fillText(`Capa ${index + 1}`, offsetX + lw + 10, y + lh / 2);
        });
        
        assemblyDiv.appendChild(canvas);
        layersContainer.appendChild(assemblyDiv);
    }

    function exportAllLayers(format, width, unit) {
        processedLayers.forEach((layer, index) => {
            setTimeout(() => {
                const downloadLink = document.createElement('a');
                
                if (format === 'svg') {
                    const svgContent = canvasToSVG(layer.canvas, width, unit);
                    const blob = new Blob([svgContent], { type: 'image/svg+xml' });
                    downloadLink.href = URL.createObjectURL(blob);
                    downloadLink.download = `layer_${index + 1}_${layer.name.replace(/\s+/g, '_')}.svg`;
                } else {
                    downloadLink.href = layer.canvas.toDataURL('image/png');
                    downloadLink.download = `layer_${index + 1}_${layer.name.replace(/\s+/g, '_')}.png`;
                }
                
                downloadLink.click();
            }, index * 500);
        });
    }
</script>
