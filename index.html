<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaserLayer Pro Splitter</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        .container { max-width: 500px; margin: 0 auto; }
        h1 { color: #00adb5; font-size: 26px; margin-bottom: 5px; font-weight: 800; }
        p { color: #aaaaaa; font-size: 13px; margin-top: 0; margin-bottom: 20px; }
        .box {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            margin-bottom: 15px;
            border: 1px solid #2d2d2d;
        }
        .btn {
            background-color: #00adb5;
            color: white;
            padding: 14px 20px;
            border-radius: 10px;
            cursor: pointer;
            display: inline-block;
            font-weight: bold;
            border: none;
            width: 100%;
            box-sizing: border-box;
            font-size: 15px;
        }
        .btn-secondary { background-color: #222831; border: 1px solid #393e46; margin-top: 10px; }
        .btn-danger { background-color: #cf6679; color: #121212; margin-top: 10px; }
        .control-group { margin: 18px 0; text-align: left; }
        label { display: block; font-size: 14px; color: #00adb5; margin-bottom: 8px; font-weight: 600; }
        .toggle-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #252525;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .toggle-group span { font-size: 14px; color: #eee; }
        select {
            width: 100%;
            background-color: #252525;
            color: white;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #393e46;
            font-size: 14px;
            outline: none;
        }
        input[type="range"] { width: 100%; accent-color: #00adb5; background: #333; height: 6px; border-radius: 3px; }
        .layer-card {
            background: #1e1e1e;
            border: 1px solid #00adb5;
            border-radius: 14px;
            padding: 15px;
            margin-top: 20px;
        }
        .layer-card canvas {
            max-width: 100%;
            height: auto;
            background: #2d2d2d;
            border-radius: 8px;
            margin: 10px 0;
        }
        #original-preview-canvas { max-width: 100%; max-height: 180px; border-radius: 8px; margin-top: 15px; background: #2d2d2d; display: block; width: 100%; }
        .checkbox-apple { WebkitAppearance: none; width: 40px; height: 20px; background: #555; border-radius: 20px; position: relative; cursor: pointer; outline: none; }
        .checkbox-apple:checked { background: #00adb5; }
        .checkbox-apple:before { content: ''; position: absolute; width: 16px; height: 16px; border-radius: 50%; top: 2px; left: 2px; background: #fff; }
        .checkbox-apple:checked:before { left: 22px; }
    </style>
</head>
<body>

<div class="container">
    <h1>LaserLayer Pro</h1>
    <p>Preparación avanzada de imágenes para corte y grabado láser</p>

    <div class="box">
        <label class="btn" style="width:auto; display:inline-block;">
            📁 1. Cargar Imagen de Origen (PNG / JPG)
            <input type="file" id="image-input" accept="image/*" style="display: none;">
        </label>
        <br>
        <canvas id="original-preview-canvas"></canvas>
    </div>

    <!-- Eliminamos el comando que ocultaba este menú, ahora saldrá siempre visible -->
    <div class="box" id="controls">
        <div class="control-group">
            <label for="layers-count">Modo Capas Automáticas: <span id="layers-val">3</span> capas</label>
            <input type="range" id="layers-count" min="2" max="6" value="3">
        </div>

        <div class="control-group">
            <label for="format-select">Formato de descarga final:</label>
            <select id="format-select">
                <option value="image/png">PNG (Fondo Transparente - Recomendado)</option>
                <option value="image/jpeg">JPG (Fondo Blanco Plano)</option>
            </select>
        </div>

        <div class="toggle-group">
            <span>Invertir Colores (Modo Negativo)</span>
            <input type="checkbox" id="invert-toggle" class="checkbox-apple">
        </div>

        <div class="toggle-group">
            <span>Extraer solo Contornos (Línea de Corte)</span>
            <input type="checkbox" id="contour-toggle" class="checkbox-apple">
        </div>

        <button class="btn btn-secondary" id="process-btn">⚙️ 2. Procesar y Separar</button>
        <button class="btn btn-danger" id="reset-btn">🗑️ Limpiar Todo</button>
    </div>

    <div id="layers-container"></div>
</div>

<script>
    const imageInput = document.getElementById('image-input');
    const originalCanvas = document.getElementById('original-preview-canvas');
    const originalCtx = originalCanvas.getContext('2d');
    const layersCount = document.getElementById('layers-count');
    const layersVal = document.getElementById('layers-val');
    const processBtn = document.getElementById('process-btn');
    const resetBtn = document.getElementById('reset-btn');
    const layersContainer = document.getElementById('layers-container');
    const invertToggle = document.getElementById('invert-toggle');
    const contourToggle = document.getElementById('contour-toggle');
    const formatSelect = document.getElementById('format-select');

    let imageLoaded = false;
    let backupImg = new Image();

    // Inicializar el cuadro de previsualización vacío con un fondo gris técnico
    originalCanvas.width = 400;
    originalCanvas.height = 150;
    originalCtx.fillStyle = "#2d2d2d";
    originalCtx.fillRect(0, 0, 400, 150);
    originalCtx.fillStyle = "#888888";
    originalCtx.font = "14px Arial";
    originalCtx.textAlign = "center";
    originalCtx.fillText("Ninguna imagen cargada aún", 200, 80);

    layersCount.addEventListener('input', () => { layersVal.textContent = layersCount.value; });

    imageInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
            const file = e.target.files[0];
            const reader = new FileReader();
            
            reader.onload = function(event) {
                backupImg = new Image();
                backupImg.onload = function() {
                    const MAX_W = 600;
                    let w = backupImg.width;
                    let h = backupImg.height;
                    if (w > MAX_W) {
                        h = Math.round((h * MAX_W) / w);
                        w = MAX_W;
                    }
                    originalCanvas.width = w;
                    originalCanvas.height = h;
                    
                    originalCtx.fillStyle = "#ffffff";
                    originalCtx.fillRect(0, 0, w, h);
                    originalCtx.drawImage(backupImg, 0, 0, w, h);
                    imageLoaded = true;
                };
                backupImg.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }
    });

    resetBtn.addEventListener('click', () => {
        imageInput.value = '';
        originalCanvas.width = 400;
        originalCanvas.height = 150;
        originalCtx.fillStyle = "#2d2d2d";
        originalCtx.fillRect(0, 0, 400, 150);
        originalCtx.fillStyle = "#888888";
        originalCtx.fillText("Ninguna imagen cargada aún", 200, 80);
        layersContainer.innerHTML = '';
        invertToggle.checked = false;
        contourToggle.checked = false;
        imageLoaded = false;
    });

    processBtn.addEventListener('click', () => {
        if (!imageLoaded) {
            alert("Por favor, selecciona primero una imagen válida haciendo clic en el botón azul.");
            return;
        }
        
        layersContainer.innerHTML = '';
        const numLayers = parseInt(layersCount.value);
        const invert = invertToggle.checked;
        const extractContours = contourToggle.checked;
        const chosenFormat = formatSelect.value;
        
        const width = originalCanvas.width;
        const height = originalCanvas.height;
        
        const imgData = originalCtx.getImageData(0, 0, width, height);
        const data = imgData.data;
        const step = 255 / numLayers;

        for (let l = 0; l < numLayers; l++) {
            const layerCanvas = document.createElement('canvas');
            layerCanvas.width = width;
            layerCanvas.height = height;
            const layerCtx = layerCanvas.getContext('2d');
            const layerImgData = layerCtx.createImageData(width, height);
            const layerData = layerImgData.data;

            const minGray = l * step;
            const maxGray = (l + 1) * step;
            const mask = new Uint8Array(width * height);

            for (let i = 0; i < data.length; i += 4) {
                const idx = i / 4;
                const alpha = data[i+3];
                
                let r = data[i];
                let g = data[i+1];
                let b = data[i+2];
                if (alpha < 10) { r = 255; g = 255; b = 255; }

                const gray = 0.299 * r + 0.587 * g + 0.114 * b;
                if (gray >= minGray && gray < maxGray) {
                    mask[idx] = 1;
                }
            }

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const idx = y * width + x;
                    const i = idx * 4;
